<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E24"/>
      <stop offset="100%" stop-color="#1a4a56"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .leaf-large {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: draw-leaf 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards, 
                 leaf-glow 2s ease-in-out 1.8s infinite;
    }
    .leaf-small {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: draw-leaf 1.4s cubic-bezier(0.4, 0, 0.2, 1) 0.4s forwards,
                 leaf-glow 2s ease-in-out 2s infinite;
    }
    .dot-center {
      opacity: 0;
      transform-origin: 600px 755px;
      animation: dot-appear 0.5s ease-out 1.2s forwards,
                 dot-pulse 1.5s ease-in-out 1.7s infinite;
    }
    .ring-outer {
      opacity: 0;
      transform-origin: 600px 755px;
      animation: ring-expand 2s ease-out 1.5s infinite;
    }
    .ring-inner {
      opacity: 0;
      transform-origin: 600px 755px;
      animation: ring-expand 2s ease-out 2s infinite;
    }
    .text-alaria {
      opacity: 0;
      animation: text-reveal 0.8s ease-out 1.6s forwards;
    }

    @keyframes draw-leaf {
      to { stroke-dashoffset: 0; }
    }
    @keyframes leaf-glow {
      0%, 100% { stroke-width: 11; opacity: 1; }
      50% { stroke-width: 13; opacity: 0.85; }
    }
    @keyframes dot-appear {
      from { opacity: 0; transform: scale(0); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes dot-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    @keyframes ring-expand {
      0% { opacity: 0.6; transform: scale(0.5); }
      100% { opacity: 0; transform: scale(3); }
    }
    @keyframes text-reveal {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <!-- Rings pulsating from center -->
  <circle class="ring-outer" cx="600" cy="755" r="20" fill="none" stroke="#0B1E24" stroke-width="1.5"/>
  <circle class="ring-inner" cx="600" cy="755" r="15" fill="none" stroke="#0B1E24" stroke-width="1"/>

  <!-- Leaves -->
  <g transform="translate(600,625) scale(1.9)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path
      class="leaf-large"
      d="M -15,130 C -20,0 -125,-137 -262,-205 C -280,-150 -260,-37 -175,37 C -105,100 -45,120 -15,130 Z"
      stroke="url(#leafGradient)"
      stroke-width="11"
      filter="url(#glow)"
    />
    <path
      class="leaf-small"
      d="M 15,130 C 25,80 55,25 95,-12 C 105,5 100,37 75,62 C 50,87 30,112 15,130 Z"
      stroke="url(#leafGradient)"
      stroke-width="11"
      filter="url(#glow)"
    />
    <circle class="dot-center" cx="0" cy="135" r="12" fill="#0B1E24"/>
  </g>

  <!-- Text -->
  <text class="text-alaria" x="600" y="1050" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="90" font-weight="bold" fill="#0B1E24" letter-spacing="18">ALARIA</text>
</svg>
