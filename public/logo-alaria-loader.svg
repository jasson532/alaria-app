<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 280 1200 940">
  <g transform="translate(600,725) scale(1.9)" stroke="#123A47" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hoja grande (ala izquierda) - aleteo desde el punto -->
    <path d="M -15,130 C -20,0 -125,-137 -262,-205 C -280,-150 -260,-37 -175,37 C -105,100 -45,120 -15,130 Z">
      <animateTransform attributeName="transform" type="rotate" values="0 0 135; -7 0 135; 0 0 135; 3 0 135; 0 0 135" dur="1s" repeatCount="indefinite"/>
    </path>
    <!-- Hoja pequeña (ala derecha) - aleteo desde el punto -->
    <path d="M 15,130 C 25,80 55,25 95,-12 C 105,5 100,37 75,62 C 50,87 30,112 15,130 Z">
      <animateTransform attributeName="transform" type="rotate" values="0 0 135; 6 0 135; 0 0 135; -2 0 135; 0 0 135" dur="1s" repeatCount="indefinite"/>
    </path>
    <!-- Punto central - quieto -->
    <circle cx="0" cy="135" r="8" fill="#123A47"/>
  </g>
  <text x="600" y="1145" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="118" font-weight="bold" fill="#123A47" letter-spacing="22">ALARIA</text>
</svg>
